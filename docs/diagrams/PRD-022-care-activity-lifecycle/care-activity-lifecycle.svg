<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Care activity lifecycle</title><desc id="desc">PRD-022 · lifecycle foundation and narrow scheduled-opportunity ledger delivered; skip, snooze and expanded notification actions deferred</desc>
<defs><style>
:root{color-scheme:light} text{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#26372d}
.h1{font-size:34px;font-weight:700}.sub{font-size:16px;fill:#617267}.kicker{font-size:12px;font-weight:700;letter-spacing:2px;fill:#55745e}
.node{fill:#fffefa;stroke:#cbd8ca;stroke-width:2}.green{fill:#e7f0e5;stroke:#8eaa8e;stroke-width:2}.sand{fill:#f4eee2;stroke:#d9c9aa;stroke-width:2}.muted{fill:#f2f4f0;stroke:#cbd1ca;stroke-width:2}.warn{fill:#fff4df;stroke:#d9b76e;stroke-width:2}
.nt{font-size:17px;font-weight:650}.small{font-size:13px;fill:#617267}.tiny{font-size:11px;fill:#718077}.line{stroke:#78917c;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.dash{stroke:#b18c49;stroke-width:2.5;stroke-dasharray:8 7;fill:none;marker-end:url(#arrowGold)}
</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6" fill="none" stroke="#78917c" stroke-width="1.5"/></marker><marker id="arrowGold" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6" fill="none" stroke="#b18c49" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="760" rx="26" fill="#f8f7f1"/>
<text x="64" y="62" class="kicker">FEED GOOD · PRODUCT ATLAS</text><text x="64" y="112" class="h1">Care activity lifecycle</text><text x="64" y="142" class="sub">PRD-022 · lifecycle foundation and narrow scheduled-opportunity ledger delivered; skip, snooze and expanded notification actions deferred</text>

<rect x="64" y="190" width="330" height="116" rx="16" class="green"/><text x="88" y="228" class="kicker">TASK DEFINITION</text><text x="88" y="260" class="nt">CareTask</text><text x="88" y="284" class="small">User-owned recurring routine</text>
<rect x="435" y="190" width="330" height="116" rx="16" class="sand"/><text x="459" y="228" class="kicker">PERSISTED SCHEDULED LEDGER</text><text x="459" y="260" class="nt">Scheduled opportunity</text><text x="459" y="284" class="small">Open · completed · cancelled (V6 record)</text>
<rect x="806" y="190" width="330" height="116" rx="16" class="green"/><text x="830" y="228" class="kicker">HISTORICAL FACT</text><text x="830" y="260" class="nt">CareEvent</text><text x="830" y="284" class="small">Actual user-recorded action</text>
<path d="M394 248H430" class="line"/><path d="M765 248H801" class="line"/>
<text x="600" y="350" text-anchor="middle" class="kicker">APPROVED CURRENT RULES</text>
<rect x="64" y="374" width="330" height="104" rx="14" class="node"/><text x="88" y="410" class="nt">Task enabled</text><text x="88" y="438" class="small">Routine can be scheduled and completed</text>
<rect x="435" y="374" width="330" height="104" rx="14" class="node"/><text x="459" y="410" class="nt">Completion succeeds</text><text x="459" y="438" class="small">Next due = completion timestamp + interval</text>
<rect x="806" y="374" width="330" height="104" rx="14" class="node"/><text x="830" y="410" class="nt">History remains append-oriented</text><text x="830" y="438" class="small">Task removal does not erase past events</text>
<path d="M394 426H430" class="line"/><path d="M765 426H801" class="line"/>
<rect x="64" y="526" width="1072" height="132" rx="16" class="warn"/><text x="88" y="562" class="kicker">DEFERRED · DO NOT INFER</text><text x="88" y="594" class="nt">Skip semantics · Snooze/defer semantics · notification actions beyond existing reminder routing</text><text x="88" y="624" class="small">Delivered: narrow scheduled-opportunity ledger (#145, #150; issue #143 closed) with effective due boundary and completion window; task edit, disable and delete cancellation rules.</text><text x="88" y="645" class="tiny">Upcoming/due/overdue are scheduling signals, not proof of biological need. Disabled/paused describes the task definition.</text>
<text x="64" y="720" class="tiny">Feed Good · Documentation diagram · See adjacent README for scope, source PRD and decision status</text>
</svg>
