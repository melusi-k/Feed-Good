name: iOS CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: classify
        run: |
          # Resolve the live base branch tip: pull_request.base.sha can be stale
          # on long-lived PRs. Always run the trusted classifier from that base.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="${{ github.event.pull_request.base.ref }}"
            git fetch origin "refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
            BASE_SHA="$(git rev-parse "refs/remotes/origin/$BASE_REF")"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE_SHA="HEAD"
            HEAD_SHA="$(git rev-parse HEAD)"
          fi
          git show "$BASE_SHA:scripts/ci/classify-changes.sh" > "$RUNNER_TEMP/classify-changes.sh"
          bash "$RUNNER_TEMP/classify-changes.sh" "${{ github.event_name }}" "$BASE_SHA" "$HEAD_SHA"
      - name: Test change classifier
        run: bash scripts/ci/test-classify-changes.sh

  # Keep the required check name stable while moving the gate itself to
  # Ubuntu. Documentation-only PRs finish here without starting macOS.
  build-and-test:
    name: build-and-test
    needs: [classify-changes, ios-validation]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enforce the required validation result
        env:
          DOCS_ONLY: ${{ needs.classify-changes.outputs.docs_only }}
          CLASSIFY_RESULT: ${{ needs.classify-changes.result }}
          IOS_RESULT: ${{ needs.ios-validation.result }}
        run: |
          if [ "$CLASSIFY_RESULT" != "success" ]; then
            echo "Change classification did not succeed; failing the required check."
            exit 1
          fi

          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ "$DOCS_ONLY" = "true" ]; then
            echo "Verified documentation-only pull request; macOS validation was correctly skipped."
            exit 0
          fi

          if [ "$IOS_RESULT" != "success" ]; then
            echo "iOS validation did not succeed (result: $IOS_RESULT)."
            exit 1
          fi

          echo "iOS validation succeeded."

  ios-validation:
    needs: classify-changes
    # Classification failures fail closed; verified docs-only PRs never
    # allocate a macOS runner.
    if: always() && (github.event_name != 'pull_request' || (needs.classify-changes.result == 'success' && needs.classify-changes.outputs.docs_only != 'true'))
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DOCS_ONLY: ${{ needs.classify-changes.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Identify pull request
        if: github.event_name == 'pull_request' && env.DOCS_ONLY != 'true'
        run: echo "PR_NUMBER=${{ github.event.pull_request.number }}" >> "$GITHUB_ENV"
      - name: Select Xcode
        if: env.DOCS_ONLY != 'true'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        if: env.DOCS_ONLY != 'true'
        run: brew install xcodegen
      - name: Generate iOS app icon
        if: env.DOCS_ONLY != 'true'
        run: bash scripts/generate-app-icon.sh
      - name: Generate project
        if: env.DOCS_ONLY != 'true'
        run: xcodegen generate
      - name: Generate fixture using the shipped V3 model graph
        if: github.event_name == 'pull_request' && (github.event.pull_request.number == 121 || github.event.pull_request.number == 122) && env.DOCS_ONLY != 'true'
        run: |
          LEGACY_DIR="$RUNNER_TEMP/feedgood-v3-source"
          git worktree add "$LEGACY_DIR" b6f65c9cbe8464d0d053ecf643fdd4408297e274
          mkdir -p /tmp/feedgood-v3-fixture
          cp scripts/LegacyV3FixtureGeneratorTests.swift "$LEGACY_DIR/FeedGoodTests/"
          cd "$LEGACY_DIR"
          bash scripts/generate-app-icon.sh
          xcodegen generate
          SIMULATOR_ID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ && /[0-9A-F-]{36}/ { print $2; exit }')"
          if [ -z "$SIMULATOR_ID" ]; then
            echo "No available iPhone simulator was found for historical V3 fixture generation."
            xcrun simctl list devices available
            exit 1
          fi
          xcodebuild test \
            -project FeedGood.xcodeproj \
            -scheme FeedGood \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/legacy-v3-derived" \
            "-only-testing:FeedGoodTests/LegacyV3FixtureGeneratorTests/generateStoreUsingShippedV3ModelGraph()" \
            CODE_SIGNING_ALLOWED=NO
          test -s /tmp/feedgood-v3-fixture/garden.store
          cd "$GITHUB_WORKSPACE"
      - name: Build app
        if: env.DOCS_ONLY != 'true'
        run: |
          xcodebuild build \
            -project FeedGood.xcodeproj \
            -scheme FeedGood \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO
      - name: Verify App Intents metadata
        if: env.DOCS_ONLY != 'true'
        run: |
          APP_PRODUCT="$(find DerivedData/Build/Products -maxdepth 3 -type d -name 'FeedGood.app' -print -quit)"
          if [ -z "$APP_PRODUCT" ]; then
            echo "The FeedGood app product was not found after the build."
            find DerivedData/Build/Products -maxdepth 4 -print
            exit 1
          fi

          METADATA_DIR="$APP_PRODUCT/Metadata.appintents"
          if [ ! -d "$METADATA_DIR" ]; then
            echo "Xcode did not produce the expected Metadata.appintents directory."
            find "$APP_PRODUCT" -maxdepth 4 -print
            exit 1
          fi

          if [ ! -s "$METADATA_DIR/extract.actionsdata" ]; then
            echo "App Intents metadata extraction output is missing or empty."
            find "$METADATA_DIR" -maxdepth 2 -type f -print
            exit 1
          fi

          echo "App Intents metadata extraction verified:"
          find "$METADATA_DIR" -maxdepth 2 -type f -print
      - name: Run PR-specific test (or full main-branch suite)
        if: env.DOCS_ONLY != 'true'
        run: |
          TEST_ARGS=()
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            case "${PR_NUMBER}" in
              127)
                TEST_ARGS+=("-only-testing:FeedGoodTests/QuietPeriodLifecycleTests")
                TEST_ARGS+=("-only-testing:FeedGoodTests/TodayCareTests")
                TEST_ARGS+=("-only-testing:FeedGoodTests/CareReminderTests")
                TEST_ARGS+=("-only-testing:FeedGoodUITests/QuietPeriodUITests")
                ;;
              185)
                TEST_ARGS+=("-only-testing:FeedGoodTests/PlantPersistenceTests")
                ;;
              186)
                TEST_ARGS+=("-only-testing:FeedGoodTests/QuietPeriodArchiveTests")
                TEST_ARGS+=("-only-testing:FeedGoodTests/JournalTests")
                TEST_ARGS+=("-only-testing:FeedGoodTests/PlantTagTests")
                TEST_ARGS+=("-only-testing:FeedGoodTests/PlantChangeTests")
                TEST_ARGS+=("-only-testing:FeedGoodTests/JournalMilestoneTests")
                ;;
              125)
                TEST_ARGS+=("-only-testing:FeedGoodTests/QuietPeriodArchiveTests")
                TEST_ARGS+=("-only-testing:FeedGoodTests/JournalTests")
                TEST_ARGS+=("-only-testing:FeedGoodTests/PlantTagTests")
                TEST_ARGS+=("-only-testing:FeedGoodTests/PlantChangeTests")
                TEST_ARGS+=("-only-testing:FeedGoodTests/JournalMilestoneTests")
                ;;
              124)
                TEST_ARGS+=("-only-testing:FeedGoodTests/QuietPeriodLifecycleTests")
                TEST_ARGS+=("-only-testing:FeedGoodTests/QuietPeriodCareIntegrationTests")
                TEST_ARGS+=("-only-testing:FeedGoodTests/PlantStoryTests")
                ;;
              123)
                TEST_ARGS+=("-only-testing:FeedGoodTests/QuietPeriodLifecycleTests")
                ;;
              122)
                TEST_ARGS+=("-only-testing:FeedGoodTests/PlantPersistenceTests/legacyStoreMigratesPlantAndRelatedRecordsWithArchiveStateDefaultingToActive()")
                TEST_ARGS+=("-only-testing:FeedGoodTests/PlantPersistenceTests/build52EraStoreOpensAndMigratesToCurrentSchema()")
                TEST_ARGS+=("-only-testing:FeedGoodTests/PlantPersistenceTests/version3StoreWithTagsMigratesToVersion4WithoutLosingRecords()")
                TEST_ARGS+=("-only-testing:FeedGoodTests/PlantPersistenceTests/shippedTopLevelV3StoreMigratesToVersion4WithoutLosingRecords()")
                ;;
              121)
                TEST_ARGS+=("-only-testing:FeedGoodTests/PlantPersistenceTests/legacyStoreMigratesPlantAndRelatedRecordsWithArchiveStateDefaultingToActive()")
                TEST_ARGS+=("-only-testing:FeedGoodTests/PlantPersistenceTests/build52EraStoreOpensAndMigratesToCurrentSchema()")
                TEST_ARGS+=("-only-testing:FeedGoodTests/PlantPersistenceTests/version3StoreWithTagsMigratesToVersion4WithoutLosingRecords()")
                TEST_ARGS+=("-only-testing:FeedGoodTests/PlantPersistenceTests/shippedTopLevelV3StoreMigratesToVersion4WithoutLosingRecords()")
                ;;
              120)
                TEST_ARGS+=("-only-testing:FeedGoodTests/PlantModelTests/plantKeepsProvidedDetails")
                ;;

              118)
                TEST_ARGS+=("-only-testing:FeedGoodTests/PlantModelTests/plantKeepsProvidedDetails")
                ;;
              117)
                TEST_ARGS+=("-only-testing:FeedGoodTests/PlantModelTests/plantKeepsProvidedDetails")
                ;;
              111)
                TEST_ARGS+=("-only-testing:FeedGoodTests/PlantPersistenceTests/build52EraStoreOpensAndMigratesToCurrentSchema")
                ;;
              112)
                TEST_ARGS+=("-only-testing:FeedGoodUITests/PlantStoryUITests/testCombinedStoryShowsCareAndObservationAndReflectsEdits")
                ;;
              113)
                TEST_ARGS+=("-only-testing:FeedGoodTests/PlantPersistenceTests/build52EraStoreOpensAndMigratesToCurrentSchema")
                TEST_ARGS+=("-only-testing:FeedGoodUITests/PlantStoryUITests/testCombinedStoryShowsCareAndObservationAndReflectsEdits")
                ;;
              126)
                TEST_ARGS+=("-only-testing:FeedGoodTests/PlantModelTests/plantKeepsProvidedDetails")
                ;;
              130)
                TEST_ARGS+=("-only-testing:FeedGoodUITests/JournalUITests")
                TEST_ARGS+=("-only-testing:FeedGoodUITests/PlantCollectionUITests")
                TEST_ARGS+=("-only-testing:FeedGoodUITests/PlantTagUITests")
                ;;
              133)
                TEST_ARGS+=("-only-testing:FeedGoodUITests/NavigationHeaderUITests")
                TEST_ARGS+=("-only-testing:FeedGoodUITests/NavigationMotionProofUITests")
                ;;
              *)
                echo "No focused test is mapped for PR #${PR_NUMBER}; running the complete FeedGood test suite."
                ;;
            esac
          else
            echo "Main branch run: executing the complete FeedGood test suite."
          fi

          SIMULATOR_ID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ && /[0-9A-F-]{36}/ { print $2; exit }')"
          if [ -z "$SIMULATOR_ID" ]; then
            echo "No available iPhone simulator was found on this runner."
            xcrun simctl list devices available
            exit 1
          fi

          echo "Testing on simulator $SIMULATOR_ID"
          if [ "${#TEST_ARGS[@]}" -gt 0 ]; then
            printf 'Focused test: %s\\n' "${TEST_ARGS[@]}"
          fi
          xcodebuild test \
            -resultBundlePath TestResults.xcresult \
            -project FeedGood.xcodeproj \
            -scheme FeedGood \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath DerivedData \
            "${TEST_ARGS[@]}" \
            CODE_SIGNING_ALLOWED=NO

      - name: Export test attachments
        if: always()
        continue-on-error: true
        run: |
          if [ -d TestResults.xcresult ]; then
            xcrun xcresulttool export attachments --path TestResults.xcresult --output-path TestAttachments
          fi
      - name: Keep test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-results
          path: |
            TestResults.xcresult
            TestAttachments
          if-no-files-found: ignore
          retention-days: 7
