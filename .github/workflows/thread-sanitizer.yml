name: Thread Sanitizer

# Runs the unit tests under the Thread Sanitizer to catch data races.
# Separate workflow so the required build-and-test check is untouched.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: thread-sanitizer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: classify
        run: |
          # Resolve the live base branch tip: pull_request.base.sha can be stale
          # on long-lived PRs. Always run the trusted classifier from that base.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="${{ github.event.pull_request.base.ref }}"
            git fetch origin "refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
            BASE_SHA="$(git rev-parse "refs/remotes/origin/$BASE_REF")"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE_SHA="HEAD"
            HEAD_SHA="$(git rev-parse HEAD)"
          fi
          git show "$BASE_SHA:scripts/ci/classify-changes.sh" > "$RUNNER_TEMP/classify-changes.sh"
          bash "$RUNNER_TEMP/classify-changes.sh" "${{ github.event_name }}" "$BASE_SHA" "$HEAD_SHA"
      - name: Test change classifier
        run: bash scripts/ci/test-classify-changes.sh

  thread-sanitizer:
    needs: classify-changes
    if: always() && (github.event_name != 'pull_request' || (needs.classify-changes.result == 'success' && needs.classify-changes.outputs.docs_only != 'true'))
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Run unit tests with Thread Sanitizer
        run: |
          SIMULATOR_ID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ && /[0-9A-F-]{36}/ { print $2; exit }')"
          if [ -z "$SIMULATOR_ID" ]; then
            echo "No available iPhone simulator was found on this runner."
            xcrun simctl list devices available
            exit 1
          fi
          echo "Testing on simulator $SIMULATOR_ID"
          xcodebuild test \
            -enableThreadSanitizer YES \
            -project FeedGood.xcodeproj \
            -scheme FeedGood \
            -only-testing:FeedGoodTests \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            CODE_SIGNING_ALLOWED=NO
