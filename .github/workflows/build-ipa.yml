name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_tests:
        description: Run the iOS unit tests before packaging
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-ipa:
    name: Archive and package Feed Good IPA
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate iOS app icon
        run: bash scripts/generate-app-icon.sh

      - name: Stamp build version and generate project
        run: |
          BASE_VERSION=$(grep -E '^    MARKETING_VERSION:' project.yml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          # Routine CI builds stamp the marketing version with the run number so
          # every build is identifiable and the release path is validated end to
          # end. A stamped build has no bundled notes of its own, so What's New
          # presents the newest bundled release's notes (ReleaseNotes
          # entryForPresentation). A product release sets MARKETING_VERSION
          # deliberately and bundles its notes before shipping.
          VERSION="$(echo "$BASE_VERSION" | cut -d. -f1-2).$BUILD_NUMBER"
          sed -i '' -E "s/^(    MARKETING_VERSION: ).*/\1\"$VERSION\"/; s/^(    CURRENT_PROJECT_VERSION: ).*/\1\"$BUILD_NUMBER\"/" project.yml
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "IPA_NAME=FeedGood-$VERSION-build$BUILD_NUMBER.ipa" >> "$GITHUB_ENV"
          xcodegen generate
          xcodebuild -version
          echo "Building Feed Good $VERSION ($BUILD_NUMBER)"

      - name: Run automated tests
        if: github.event_name == 'push' || inputs.run_tests
        run: |
          SIMULATOR_ID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ && length($2) == 36 { print $2; exit }')"
          if [ -z "$SIMULATOR_ID" ]; then
            echo "No available iPhone simulator was found on this runner."
            xcrun simctl list devices available
            exit 1
          fi
          echo "Testing on simulator $SIMULATOR_ID"
          xcodebuild test \
            -project FeedGood.xcodeproj \
            -scheme FeedGood \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            CODE_SIGNING_ALLOWED=NO

      - name: Archive for iOS devices
        run: |
          xcodebuild archive \
            -project FeedGood.xcodeproj \
            -scheme FeedGood \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/FeedGood.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -quiet

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/FeedGood.xcarchive/Products/Applications/FeedGood.app"
          test -d "$APP_PATH" || { echo "::error::Archived FeedGood.app not found"; exit 1; }
          mkdir -p build/Payload dist
          cp -R "$APP_PATH" build/Payload/
          (cd build && /usr/bin/zip -qry "../dist/$IPA_NAME" Payload)
          test -s "dist/$IPA_NAME"

      - name: Verify IPA contents
        run: |
          mkdir -p build/verify
          unzip -q "dist/$IPA_NAME" -d build/verify
          APP="build/verify/Payload/FeedGood.app"
          PLIST="$APP/Info.plist"
          plutil -lint "$PLIST"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$PLIST")
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$PLIST")
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$PLIST")
          EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$PLIST")
          [ "$BUNDLE_ID" = "com.melusik.feedgood" ] || { echo "::error::Unexpected bundle ID: $BUNDLE_ID"; exit 1; }
          [ "$VERSION" = "$APP_VERSION" ] || { echo "::error::Unexpected version: $VERSION"; exit 1; }
          [ "$BUILD" = "$BUILD_NUMBER" ] || { echo "::error::Unexpected build number: $BUILD"; exit 1; }
          [ -x "$APP/$EXECUTABLE" ] || { echo "::error::App executable missing"; exit 1; }
          lipo -archs "$APP/$EXECUTABLE" | grep -q arm64 || { echo "::error::IPA does not contain arm64"; exit 1; }
          [ -s "$APP/Assets.car" ] || { echo "::error::Compiled asset catalog missing"; exit 1; }
          {
            echo "### Feed Good IPA"
            echo
            echo "| Property | Value |"
            echo "|---|---|"
            echo "| Version | $VERSION |"
            echo "| Build | $BUILD |"
            echo "| Bundle ID | $BUNDLE_ID |"
            echo "| Package | $IPA_NAME (unsigned) |"
            echo "| App icon | Included in Assets.car |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: FeedGood-IPA-${{ github.run_number }}
          path: dist/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TESTS_RAN: ${{ github.event_name == 'push' || inputs.run_tests }}
        run: |
          set -euo pipefail
          TAG="build-$BUILD_NUMBER"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release $TAG already exists; leaving it unchanged"
            exit 0
          fi
          SHORT=$(git rev-parse --short HEAD)
          PREV=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // empty')
          if [ -n "$PREV" ] && git rev-parse -q --verify "refs/tags/$PREV^{commit}" >/dev/null; then
            git log "$PREV..HEAD" --no-merges --format='%s' > build/changes.txt
          fi
          if [ ! -s build/changes.txt ]; then
            git log -1 --format='%s' > build/changes.txt
          fi
          FEATURE=$(head -1 build/changes.txt | sed -E 's/ \(#[0-9]+\)$//')
          if [ "$TESTS_RAN" = "true" ]; then
            TESTS="The unit tests ran in this build and passed."
          else
            TESTS="The unit tests were skipped in this build."
          fi
          {
            echo "Main feature: $FEATURE"
            echo
            echo "Changes in this build, newest first, taken from the commit titles since the previous build."
            echo
            sed 's/^/- /' build/changes.txt
            echo
            echo "## What to Test"
            echo
            sed -E 's/ \(#[0-9]+\)$//; s/^/- Check: /' build/changes.txt
            echo "- Close and reopen the app and confirm what you saved is still there."
            echo "- Look at the main screens in light and dark appearance."
            echo
            echo "## How to Test"
            echo
            echo "1. Download $IPA_NAME below. It is unsigned and needs signing with your sideloading tool before installation on an iOS 18+ device."
            echo "2. Open Feed Good and go through each item under What to Test."
            echo "3. Force-quit and reopen the app, then confirm your changes are still there."
            echo "4. Repeat the main screens in light and dark appearance."
            echo
            echo "## Build evidence"
            echo
            echo "Source: $SHORT. Build IPA run: $RUN_URL. $TESTS The IPA contents were checked (bundle ID, version, build number, arm64). Automated success is not physical-device acceptance; this IPA has not been installed or device-tested."
          } > build/release-notes.md
          gh release create "$TAG" "dist/$IPA_NAME" \
            --target "$GITHUB_SHA" \
            --title "Feed Good $APP_VERSION (build $BUILD_NUMBER): $FEATURE" \
            --notes-file build/release-notes.md \
            --prerelease \
            --latest=false
          echo "Published pre-release $TAG" >> "$GITHUB_STEP_SUMMARY"
