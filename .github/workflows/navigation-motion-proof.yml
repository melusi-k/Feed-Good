name: Navigation motion proof

on:
  pull_request:
    paths:
      - '.github/workflows/navigation-motion-proof.yml'
      - 'FeedGoodUITests/NavigationMotionProofUITests.swift'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: motion-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: brew install xcodegen
      - name: Prepare simulator and proof metadata
        run: |
          mkdir -p MotionProof
          git rev-parse HEAD > MotionProof/head.txt
          printf '%s\n' 'SIMULATOR (CI), recorded frames, not a device or released IPA. Validate recorder timestamps before judging timing.' > MotionProof/scope.txt
          SIMULATOR_ID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ && /[0-9A-F-]{36}/ { print $2; exit }')"
          test -n "$SIMULATOR_ID"
          echo "SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIMULATOR_ID"
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          xcodegen generate
      - name: Build proof without changing product behavior
        run: |
          xcodebuild build-for-testing \
            -project FeedGood.xcodeproj -scheme FeedGood \
            -derivedDataPath ProofDerivedData \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            CODE_SIGNING_ALLOWED=NO
      - name: Record motion journey
        shell: bash
        run: |
          # Disable test-runner cloning so simctl records the actual tested device.
          xcrun simctl io "$SIMULATOR_ID" recordVideo --codec=h264 --force MotionProof/navigation.mp4 > MotionProof/recorder.log 2>&1 &
          RECORDER_PID=$!
          stop_recording() {
            kill -INT "$RECORDER_PID" 2>/dev/null || true
            wait "$RECORDER_PID" || true
          }
          trap stop_recording EXIT
          sleep 2
          date -u '+%Y-%m-%dT%H:%M:%SZ' > MotionProof/test-start-utc.txt
          set -o pipefail
          xcodebuild test-without-building \
            -project FeedGood.xcodeproj -scheme FeedGood \
            -derivedDataPath ProofDerivedData \
            -resultBundlePath MotionProof/TestResults.xcresult \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -parallel-testing-enabled NO \
            -only-testing:FeedGoodUITests/NavigationMotionProofUITests \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee MotionProof/test.log
      - name: Keep motion evidence even on test failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: navigation-motion-proof
          path: MotionProof
          if-no-files-found: error
          retention-days: 7
